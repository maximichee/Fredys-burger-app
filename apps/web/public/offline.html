<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0b09">
  <title>Sin conexión | Fredy's Burger</title>
  <style>
    :root { --bg: #0f0b09; --brand: #fb8500; --crema: #fff3e0; --apagado: #c9b3a1; --choco: #3a1f1a; --line: rgba(255, 214, 170, .14); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--crema);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 112px; height: 112px; border-radius: 50%; }
    h1 { margin: 20px 0 8px; font-family: Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 2.6rem; line-height: .95;
      text-transform: uppercase; letter-spacing: .01em; text-shadow: 2px 2px 0 var(--brand), 5px 5px 0 var(--choco); }
    p { margin: 0 0 24px; color: var(--apagado); line-height: 1.5; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-bottom: 12px; border-radius: 999px;
      font-weight: 800; font-size: 1.05rem; text-decoration: none; cursor: pointer; border: 0; }
    .btn--naranja { background: var(--brand); color: #160d09; box-shadow: 0 .4em 0 var(--choco); }
    .btn--borde { background: transparent; color: var(--crema); border: 2px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <img src="/iconos/icono-192.png" alt="Fredy's Burger">
    <h1>Te quedaste sin señal</h1>
    <p>Cuando vuelva la conexión, el menú se carga solo. Si es urgente, pedí por WhatsApp.</p>
    <button class="btn btn--naranja" onclick="location.reload()">Probar de nuevo</button>
    <a class="btn btn--borde" href="https://wa.me/5493425039876?text=Hola%20Fredy's%2C%20quiero%20hacer%20un%20pedido.">Pedir por WhatsApp</a>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
